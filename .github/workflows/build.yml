# PhotoSuite CI: tests on every push; installers for every platform on a `v*` tag (or a manual
# run); a tag also gathers them into a draft GitHub Release.
#
# Artifacts per packaging run (packaging/* scripts do the work; this file only prepares runners):
#   photosuite-macos            universal (arm64 + x86_64) .dmg, CLI .zip
#   photosuite-windows          x64 .msi installer, portable .zip
#   photosuite-linux-x86_64     .AppImage (+ .zsync), .deb, .rpm, Arch .pkg.tar.zst, .tar.gz
#   photosuite-linux-aarch64    .AppImage (+ .zsync), .deb, .rpm, Arch .pkg.tar.zst, .tar.gz
#   photosuite-flatpak-x86_64   single-file .flatpak bundle (built from the x86_64 tarball)
#
# Linux builds on Ubuntu 22.04 (glibc 2.35) so the binaries run on newer distributions too.
#
# Signing is optional: without the secrets below the packages are built unsigned (macOS ad-hoc).
#   macOS     APPLE_CERTIFICATE (base64 .p12 "Developer ID Application"), APPLE_CERTIFICATE_PASSWORD,
#             KEYCHAIN_PASSWORD; notarization: APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID,
#             APPLE_API_ISSUER
#   Windows   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD, or Azure Trusted
#             Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#             AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE (see packaging/windows/sign.ps1)

name: PhotoSuite

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: photosuite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    env:
      # No debuginfo: faster to compile and link, and a much smaller cache. The tests themselves
      # take seconds; nearly all of this job is the build.
      CARGO_PROFILE_DEV_DEBUG: 0
    # Pull requests from branches of this repository already ran on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the build cache even when a test fails, so the next run isn't a cold build.
          cache-on-failure: true
      - name: Tests
        # Every failure in one run, rather than stopping at the first failing test binary.
        run: cargo test --workspace --locked --no-fail-fast
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Crate licences are up to date (THIRD-PARTY-CRATES.md)
        run: packaging/notices/generate.sh --check

  macos:
    name: Package (macOS universal)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      DIST: ${{ github.workspace }}/dist/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::no App Store Connect API key: the build will not be notarized"
          fi
      - name: Build and package
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: photosuite-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Package (Windows x64)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    env:
      DIST: ${{ github.workspace }}\dist\release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: photosuite-windows
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Package (Linux ${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          # arm64 builds natively on GitHub's hosted arm64 runner; package.sh names every
          # package by architecture, so the two sets don't collide in the release.
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    env:
      DIST: ${{ github.workspace }}/dist/release
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            desktop-file-utils appstream file zsync
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install nfpm (deb / rpm / Arch)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: packaging/linux/package.sh --formats "appimage deb rpm arch tar"
      # The AppImage about to be published: its desktop entry, AppStream metadata, notices,
      # embedded update information, and a .zsync that rebuilds it byte for byte.
      - name: Verify AppImage
        run: packaging/linux/verify-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: photosuite-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    name: Package (Flatpak x86_64)
    needs: linux
    # Not 22.04: its flatpak-builder (1.2) runs appstream-compose, which current SDKs no longer
    # ship. This job only repackages the x86_64 binaries, so the runner's glibc doesn't matter.
    runs-on: ubuntu-24.04
    # The Flatpak needs the Flathub runtime; a Flathub outage shouldn't hold back the release.
    continue-on-error: true
    env:
      DIST: ${{ github.workspace }}/dist/release
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common appstream
      - uses: actions/download-artifact@v4
        with:
          name: photosuite-linux-x86_64
          path: dist/release
      - name: Bundle
        run: |
          rm -f dist/release/*.AppImage dist/release/*.deb dist/release/*.rpm dist/release/*.pkg.tar.zst
          packaging/linux/flatpak-bundle.sh
          rm -f dist/release/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: photosuite-flatpak-x86_64
          path: dist/release/*.flatpak
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: photosuite-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
