[package]
name = "photosuite"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "photosuite"
description = "PhotoSuite: an open-source, native image editor"
build = "build.rs"

[lints]
workspace = true

[dependencies]
photosuite-doc = { workspace = true }
photosuite-color = { workspace = true }
photosuite-raster = { workspace = true }
photosuite-geom = { workspace = true }
photosuite-compose = { workspace = true }
photosuite-engine = { workspace = true }
photosuite-codecs = { workspace = true }
photosuite-io = { workspace = true }
photosuite-format = { workspace = true }
photosuite-automation = { workspace = true }
photosuite-ui-egui = { workspace = true }
# Pen tablet pressure/tilt on macOS and X11 (the workspace's one isolated unsafe helper crate).
photosuite-tablet = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { version = "3.6", features = ["wayland-data-control"] }
open = "5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Wayland compositors that leave window decorations to the app (GNOME) get winit's own. eframe
# turns winit's default features off, which leaves its most basic frame, with no title; this is
# the Adwaita-style one, showing the window title. KDE, Sway and others draw their own, and X11
# window managers always do.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click / Open With / Dock drops arrive as Apple events; this small audited crate
# registers the handler (Objective-C interop needs unsafe, which our workspace forbids) behind a
# safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
muda = "0.21.0"
# Safe AppKit calls only: find where the pointer is when files are dropped (cursor.rs; winit 0.30
# drops carry no position). Already in Cargo.lock (winit, photosuite-tablet); pinned exactly to the
# same versions.
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSApplicationScripting", "NSEvent", "NSResponder", "NSView", "NSWindow"] }

# Drop position on X11 (`cursor.rs`): pure-Rust X client, already in Cargo.lock; pinned exactly.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false }

# Drop position on Windows (`cursor.rs`): safe Win32 wrappers (GetCursorPos), no dependencies of
# its own. Pinned exactly: review the diff before bumping.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }

[build-dependencies]
# Icon + VERSIONINFO for photosuite.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
