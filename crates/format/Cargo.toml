[package]
name = "photosuite-format"
description = "Native .pcraft document bundle: manifest + content-addressed zstd tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photosuite-geom = { workspace = true }
photosuite-color = { workspace = true }
photosuite-raster = { workspace = true }
photosuite-doc = { workspace = true }
photosuite-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
flate2 = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
ruzstd = "0.9"

[dev-dependencies]
proptest = { workspace = true }
