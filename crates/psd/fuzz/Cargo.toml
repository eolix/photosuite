[package]
name = "photosuite-psd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone: excluded from the photosuite workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
photosuite-psd = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abr"
path = "fuzz_targets/abr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_source_data"
path = "fuzz_targets/image_source_data.rs"
test = false
doc = false
bench = false
