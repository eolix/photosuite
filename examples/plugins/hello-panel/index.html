<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: CanvasText;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 8px;
      opacity: 0.85;
    }
    ol {
      margin: 0 0 10px 18px;
      padding: 0;
      opacity: 0.85;
    }
    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
      color: inherit;
      cursor: pointer;
    }
    button:hover {
      background: color-mix(in srgb, Canvas 85%, CanvasText 15%);
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    pre {
      margin: 10px 0 0;
      padding: 8px;
      border-radius: 6px;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 3em;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <p>Adds a text layer to the open document using a PhotoSuite action script.</p>
  <ol>
    <li>Open or create an image.</li>
    <li>Click the button below.</li>
    <li>Look on the canvas and in the Layers panel.</li>
  </ol>
  <button id="add-text" type="button">Add “Hello World!” text layer</button>
  <pre id="log">Waiting for PhotoSuite…</pre>
  <script src="panel.js"></script>
</body>
</html>
