<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoSuite - Open Source PS alternative</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="PhotoSuite logo" width="200" height="200">
            </div>
            <h1>PhotoSuite</h1>       
        </header>
        
        <main>
            <p class="description">
                A powerful, open-source photo editing application with native PSD compatibility and features for photographers and designers with déjà vu.
            </p>
            
            <div class="downloads" id="downloads">
                <p class="loading">Loading latest version...</p>
            </div>
            
            <div class="github-link">
                <a href="https://github.com/eolix/photosuite" target="_blank" rel="noopener noreferrer">
                    <img src="images/github.png" alt="GitHub">
                    <span>View on GitHub</span>
                </a>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
